<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScrKeyboard WebForms fixture</title>
    <style>
      body {
        margin: 40px;
        color: #17202a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      form {
        display: grid;
        gap: 16px;
        max-width: 520px;
      }

      .form-spacer {
        min-height: 760px;
        border: 1px dashed #d7dde5;
        border-radius: 6px;
        padding: 16px;
        color: #697480;
        font-weight: 600;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 650;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #b8c0cc;
        border-radius: 6px;
        padding: 10px 12px;
        font: inherit;
      }

      .event-log {
        box-sizing: border-box;
        max-width: 520px;
        margin-top: 18px;
        border: 1px solid #d7dde5;
        border-radius: 6px;
        padding: 10px 12px;
        background: #f7f8fa;
        color: #2f3a45;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>WebForms Fixture</h1>
    <form id="aspnetForm" method="post">
      <input type="hidden" name="__VIEWSTATE" value="fixture" />
      <label>
        Customer reference
        <input id="ctl00_MainContent_CustomerReference" name="ctl00$MainContent$CustomerReference" type="text" />
      </label>
      <label>
        Notes
        <textarea id="ctl00_MainContent_Notes" name="ctl00$MainContent$Notes" rows="4"></textarea>
      </label>
      <div class="form-spacer">Long WebForms content spacer</div>
      <label>
        Footer reference
        <input id="ctl00_MainContent_FooterReference" name="ctl00$MainContent$FooterReference" type="text" />
      </label>
      <button type="submit">Submit</button>
    </form>
    <p id="event-log" class="event-log" aria-live="polite">Last event: none</p>
    <script>
      const form = document.querySelector('#aspnetForm');
      const eventLog = document.querySelector('#event-log');

      form.addEventListener('keydown', (event) => {
        eventLog.textContent = `Last keydown: ${event.key} ctrl=${event.ctrlKey}`;
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        eventLog.textContent = 'Last event: submit prevented';
      });
    </script>
  </body>
</html>
